ute": ["集宁酒店", "乌兰哈达火山开放游览区", "察右后旗白音察干住宿"], "drive": "规划预算：集宁→火山约1.5—2.5小时；火山→白音察干约40—60分钟。均非实时导航，园内交通与长时排队另算。", "stops": [["早晨", "查看察右后旗气象预警和景区公告；有大风、降雪结冰或体感不适，直接取消户外支线。"], ["白天／约2—3小时", "按已购票种及当日交通组织进园。选择合法开放、容易退出的一两个观察点，停留时长含孩子休息，不承诺全部火山通达。"], ["下午", "不等日落，回白音察干镇酒店，清洁鞋子、吃热饭。"], ["晚上", "检查返京路线，司机充分休息。"]], "kid": ["看深浅不同的岩石颜色、形状，用照片记录，不采挖、不带走火山石。", "在安全开放区域玩“找纹理”观察游戏；宇航服拍照是可删付费体验，不作为旅行主目的。", "不靠近火山口陡边、不越护栏，不开车碾草地；大风时别为了拍照继续爬。"], "food": "以白天热饭为主，车里备保温水和简单食物。野外禁生火，不依赖景区某个摊位必定营业。", "hotel": "察右后旗白音察干镇一晚；不住火山野营帐篷。酒店供暖、热水、停车必须电话确认。", "notes": ["出发前核真实预约、孩子规则和私家车入园方式；旧攻略“免费随便开进去”不采用。", "保护区或未开放路线不能为了少爬山开车闯入。", "不是看翠绿草原的夏季行程；是否值得多开这一段，取决于全家对地质景观的兴趣。", "仅10月3日出发示例：D4为10/6，察右后旗预报多云转晴、6～17℃、3-4级。出发日改变则不可照用；以出行前更新预报为准。"], "backup": "有风雪预警、结冰、低能见度或孩子受冷不适，就不进火山区。已在集宁则休息后选择安全返京；尚未离开大同则取消支线。"}, {"title": "察右后旗 → 北京：全天留给返程", "brief": "返京", "summary": "第五天不再去黄花沟或草原天路。", "route": ["白音察干", "北京"], "drive": "规划预算：白音察干→北京约6—8小时，含适量休息；国庆返京可能超出。当天若从火山景区出发会更长，不把游览与这段返程叠在一起。", "stops": [["早餐后", "尽早在白天出发，具体道路选择听实时导航和交警。"], ["途中", "分段驾驶、每1.5—2小时停一次。跨风口路段注意横风，按道路提示限速。"], ["傍晚前后", "以路况决定抵达时间，不承诺天黑前一定到家。必要时安全停留。"]], "kid": ["今天是长车程，提前下载音乐／故事，屏幕使用适量。", "孩子不在行驶中解开安全带或躺卧。"], "food": "早餐和午餐按正规餐馆／服务区安排，不为赶路省午饭。", "hotel": "回北京。", "notes": ["最晚返程安排要服从司机体力与道路条件，而非高速免费时刻。", "若只能单人开车或孩子很不耐坐，优先选4天大同线。"], "backup": "天气影响行车就延后或就近安全住宿，不临时绕行未核实乡道。"}]}}, "priorities": ["先锁云冈石窟预约日期与时段，再倒推行程；未实际查询余票，不代表有票。", "再订可取消酒店，电话确认2大1小入住、停车与热水／供暖。", "选5天时，先核察右后旗预警与火山交通规则；不只看乌兰察布市区天气。", "悬空寺只作替换项：先确认登临票，再决定是否去浑源；不买“包免排队”承诺。"], "critical": "察右后旗10月3日预报雨夹雪转多云、-1～11℃、4—5级风，10月4日仍4—5级风。带6岁孩子，不建议这两天安排火山登顶；5天方案只作后半程、天气复核通过后的备选。[5]", "cautions": ["4天线D2／D3可以按云冈余票互换；3天线若没有合适的云冈预约，先改出发日期或接受只游古城，不以排好的日程冒充已约到票。", "不把网上旧版“火山免费随便自驾”和景区历史开放时间当今年国庆规则。", "孩子年龄已知、身高未知；每个景区、景交、早餐与登临票分开核，不能全程统称“6岁免费”。"], "choices": ["云冈石窟：主线优先保留；古城：轻松补充。", "华严寺／大同博物馆：二选一，更适合亲子减量。", "悬空寺：建筑独特，但假期登临票与排队是硬约束；怕高或不耐等待就只考虑地面远观，也要核景区入园要求。", "恒山：本次不默认安排。山路与悬空寺不要连着叠给6岁孩子。", "乌兰哈达火山：只放5天方案。黄花沟／辉腾锡勒不再加，不为“到过乌兰察布”硬凑草原项目。"], "tickets": [{"name": "云冈石窟｜先锁预约，再定行程", "items": ["入口：云冈石窟微信公众号或“云冈石窟文旅”小程序。自2026-04-15起可提前15日预约，不含当天；不要到场再买当天票。[9]", "国庆10/1—10/7开放06:30—18:00，18:00后停止检票，仍须预约指定日期与时段。[8]", "儿童：2024官方消息报道的边界是“6周岁（含）以下或身高1.2米以下”；2026报道又概括政策性免票人群需实名预约。因此孩子按免票资格准备年龄证件，但是否需单独登记／0元票必须在当前小程序核实，不能保证免预约。[10][9]", "国庆景区汇总公告列第5、16、18窟及云冈石窟博物馆、宿白纪念馆暂不开放；当天以现场为准，不把这些展项当必看。[14]", "本次未核官方最终票价和实时余票；以选定日期、票种后的结算页为准，不用OTA起价当全家总价。"]}, {"name": "华严寺｜古城主项目，儿童规则仍需核", "items": ["OTA资料列旺季成人50元；儿童“6周岁（含）以下或身高1.2米（含）以下”免票。此为去哪儿资料、不是本次官方结算页；2026是否需0元预约仍待核。[17]", "搜索并核认证“大同华严寺景区”官方账号；现行预约期限和国庆确切开放时刻未获得可靠官方原文，不承诺随到随买。", "建议看1.5—2小时即回，不与全天石窟或浑源行程叠加。"]}, {"name": "大同市博物馆｜雨备，但要先约", "items": ["2026国庆10/1—10/7总馆及分馆正常开放、10/8闭馆；总馆设备更新，实行分区开放。具体开放展厅未核，不能保证想看的某厅开放。[15]", "大同市博物馆微信公众号“门票预定”。2023大同日报规则为提前7日（含当天）全员实名免费预约；6岁由家长代约。2026放号与儿童登记界面需复核，免费不等于免预约。[16]", "无馆约或道路不安全，雨备改酒店休息，不临时去山谷、河滩或玻璃设施。"]}, {"name": "悬空寺｜只替换D3，不附带爬恒山", "items": ["入口：“北岳云游”小程序。9/24公告自10/2调整：线上登临2000张，提前7天预售保持；现场475张仅限列明特殊人群，普通亲子游客不要指望线下补登临票。[11]", "公告原文列预约当天7:20—18:00、预约前一天20:00—23:00，并写提前7天预售不变；具体日期与放票对应关系以小程序为准，不自行解读为只能前一天抢。[11]", "官网票价列首道门票15元、登临100元／成人；摆渡另核。旧官网儿童优惠含6周岁，但2026儿童登临免票、预约名额和摆渡规则没有分别核明，不写“孩子全免”。[12][13]", "自驾需按现场引导停游客中心或应急停车场后接驳，不能承诺开到寺门。票务咨询0352-8333031、悬空寺0352-8327795，出发前确认。[14]", "替换法：D3早餐后大同→浑源（规划约1.5—2小时），只安排悬空寺，含接驳、排队与午餐后回大同原酒店；怕高、无登临票或排队过久就不登临。返京仍放D4。"]}, {"name": "乌兰哈达火山｜有预约、交通与天气门槛", "items": ["国庆提示提前1—2天预约，按实际游玩日期选票；自驾余票按预约和实时交通动态调整。存在景交车方案，但不是保证你能开私家车进去。[3]", "9/27公告说明9/28—29临时北进北出；9/30起恢复南北双向通行。不能把两天施工规则当整个国庆规则，仍服从当日更新与现场指挥。[2]", "景交南北线在4号火山衔接。带孩子只选合法开放的一两个观察点，不串满全部站点。[2]", "火山成人票、自驾票包含人数、儿童6岁规则未核，不给“免费”的承诺。咨询0474-4811717／0474-4811766；预订前确认当前官方联系方式。"]}], "weather": ["以下为2026-10-02读取的中国天气网预报，不是现场实测、不是火山口风速；离线攻略不会自动更新。[4][5]", "大同：10/3 晴转多云0～17℃；10/4 晴-2～14℃；10/5 晴-1～18℃；10/6 晴1～22℃；10/7 晴3～22℃。早晚需保暖。[4]", "察右后旗：10/3 雨夹雪转多云-1～11℃、4—5级风；10/4 晴0～10℃、4—5级风；10/5 晴0～13℃、3—4级风；10/6 多云转晴6～17℃、3—4级风；10/7 多云转晴8～20℃、3—4级风。[5]", "如果10月3日出发，5天示例的火山日为10月6日，只能说当前旗级预报较前段缓和，不能保证火山现场安全。出发前再查预警，强风／道路湿滑即删除支线。", "国庆10/1—10/7放假；7座及以下符合政策的小型客车免费高速时间为10/1 00:00—10/7 24:00，以驶离出口收费车道时间为准，特殊道 const data=JSON.parse(document.getElementById('trip-data').textContent);let plan='4',tab='overview',day=0,rain=false;const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function list(xs){return '<ul>'+xs.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>'}function card(title,body,extra=''){return `<section class="card ${extra}"><h3>${esc(title)}</h3>${body}</section>`}function route(xs){return '<div class="route" aria-label="路线顺序示意，非导航地图">'+xs.map(esc).join('<span class="arrow"> → </span>')+'</div><p class="muted">路线顺序示意，不按距离或地理比例绘制；实际通行路线以当日导航与交通管制为准。</p>'}
function sources(){return '<details><summary>核验来源与待核边界</summary>'+data.sources.map(s=>`<div class="source"><a href="${esc(s.url)}" target="_blank" rel="noopener">[${s.id}] ${esc(s.title)}</a><p>${esc(s.note)}</p></div>`).join('')+'</details>'}
function render(){let p=data.plans[plan];$('#plans').innerHTML=Object.entries(data.plans).map(([k,v])=>`<button data-plan="${k}" aria-pressed="${k===plan}">${esc(v.short)}</button>`).join('');document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.tab===tab));let out='';if(tab==='overview'){out=card(p.title,`<p class="lead">${esc(p.intro)}</p>${route(p.route)}<p><b>住宿：</b>${esc(p.stay)}</p>`,'highlight');out+='<div class="grid">'+card('为什么这样排',list(p.why))+card('先处理这几件事',list(data.priorities))+'</div><div style="height:16px"></div>';out+=card('逐日一眼看懂',p.days.map((d,i)=>`<div class="rule"><span class="label">D${i+1}</span> <b>${esc(d.title)}</b><p class="muted">${esc(d.summary)}</p><button data-jump="${i}">看当天安排</button></div>`).join(''));out+=card('国庆特别提醒',`<div class="warning">${esc(data.critical)}</div>${list(data.cautions)}`);out+=card('取舍建议',list(data.choices));out+=sources()}else if(tab==='days'){day=Math.min(day,p.days.length-1);const d=p.days[day];out='<div class="pill">'+p.days.map((x,i)=>`<button data-day="${i}" aria-pressed="${day===i}">D${i+1} ${esc(x.brief)}</button>`).join('')+'</div>';out+=card(d.title,`<p>${esc(d.summary)}</p>${route(d.route)}<p class="muted">${esc(d.drive)}</p><button id="rain" aria-pressed="${rain}">${rain?'已选：天气差／累了':'切换：天气差／累了'}</button>`);if(rain)out+=card('当天减量方案',`<p>${esc(d.backup)}</p>`,'highlight');out+=card('行程节奏','<div class="timeline">'+d.stops.map(s=>`<div class="stop"><div class="time">${esc(s[0])}</div><p>${esc(s[1])}</p></div>`).join('')+'</div>');out+='<div class="grid">'+card('带孩子怎么玩',list(d.kid))+card('吃饭与住宿',`<p>${esc(d.food)}</p><p class="rule"><b>住：</b>${esc(d.hotel)}</p>` )+'</div><div style="height:16px"></div>';out+=card('预约与体力退出点',list(d.notes));out+=sources()}else{out=card('预订顺序',list(data.priorities),'highlight');out+=card('景点与儿童规则',data.tickets.map(t=>`<details><summary>${esc(t.name)}</summary>${list(t.items)}</details>`).join(''));out+=card('天气与自驾',list(data.weather.concat(data.driving)));out+=card('住宿怎么选',list(data.hotels));out+=card('预算不编“国庆实时价”',`<p>${esc(data.budget)}</p>`);out+=card('出发前打勾',data.checklist.map((t,i)=>`<label class="check"><input type="checkbox" data-check="${i}"><span>${esc(t)}</span></label>`).join(''));out+=sources();out+='<button class="noprint" id="print">打印当前页</button>'}out+='<p class="footer">规划建议与实时事实分开呈现。车程为行程预算，并非实时路况；不保证当日有票、有房、无排队。离线文件不会自动刷新天气和公告。微信预览不支持交互时，请下载后用系统浏览器打开。</p>';$('#content').innerHTML=out;document.querySelectorAll('[data-check]').forEach(x=>{try{x.checked=localStorage.getItem('dt-trip-'+x.dataset.check)==='1'}catch(e){}})}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.plan){plan=b.dataset.plan;day=0;rain=false}else if(b.dataset.tab){tab=b.dataset.tab}else if(b.dataset.day!==undefined){day=+b.dataset.day}else if(b.dataset.jump!==undefined){day=+b.dataset.jump;tab='days'}else if(b.id==='rain'){rain=!rain}else if(b.id==='print'){window.print();return}else{return}render();window.scrollTo({top:0,behavior:'instant'})});document.addEventListener('change',e=>{if(e.target.dataset.check!==undefined)try{localStorage.setItem('dt-trip-'+e.target.dataset.check,e.target.checked?'1':'0')}catch(err){}});document.addEventListener('keydown',e=>{if(tab==='days'&&(e.key==='ArrowRight'||e.key==='ArrowLeft')&&e.target.tagName!=='INPUT'){e.preventDefault();day=(day+(e.key==='ArrowRight'?1:-1)+data.plans[plan].days.length)%data.plans[plan].days.length;render()}});render();
</script></html>
